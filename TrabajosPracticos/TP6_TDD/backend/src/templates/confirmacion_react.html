{% extends "base.html" %}

{% block title %}Compra Confirmada (React){% endblock %}

{% block content %}
<h2 style="color: #134611;">✅ Compra Confirmada (React)</h2>

<div id="confirmacion-root"></div>

<!-- React + Babel por CDN -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

{% raw %}
<script type="text/babel">
  const { useEffect, useState } = React;

  function Confirmacion() {
    const [resultado, setResultado] = useState(null);

    useEffect(() => {
      try {
        const raw = sessionStorage.getItem('compra_resultado');
        if (raw) {
          setResultado(JSON.parse(raw));
        }
      } catch (e) {
        console.error('Error leyendo resultado:', e);
      }
    }, []);

    if (!resultado) {
      return (
        <div className="error">
          <p>No se encontró una compra reciente.</p>
          <a href="/comprar-react"><button>Ir a Comprar</button></a>
        </div>
      );
    }

    return (
      <div className="success" style={{ padding: 20 }}>
        <h3>🎉 ¡Compra procesada con éxito!</h3>
        <p><strong>Estado:</strong> {resultado.status}</p>
        <p><strong>Fecha de Visita:</strong> {resultado.fecha}</p>
        <p><strong>Cantidad:</strong> {resultado.cantidad}</p>
        <p><strong>Total Pagado:</strong> ${'{'}resultado.total_pagado{'}'}</p>
        <p><strong>Email de Confirmación:</strong> {resultado.email}</p>

        <div style={{ marginTop: 20 }}>
          <a href="/"><button>🏠 Volver al Inicio</button></a>
          <a href="/comprar-react" style={{ marginLeft: 10 }}><button>🎫 Comprar Más Entradas</button></a>
          <button onClick={() => window.print()} style={{ marginLeft: 10 }}>🖨️ Imprimir</button>
        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('confirmacion-root'));
  root.render(<Confirmacion />);
</script>
{% endraw %}
{% endblock %}
